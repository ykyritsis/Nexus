<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Illustration of the Nexus overlay: tabs, game tiles and a focus ring gliding between them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2b3f"/><stop offset="1" stop-color="#2d1b33"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#8e2de2"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0f9b8e"/><stop offset="1" stop-color="#b4f05a"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7b733"/><stop offset="1" stop-color="#fc4a1a"/></linearGradient>
    <linearGradient id="t4" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4facfe"/><stop offset="1" stop-color="#3a3d98"/></linearGradient>
    <style>
      .label { font: 600 15px 'Inter', 'Segoe UI', sans-serif; fill: #ffffffd9; }
      .small { font: 500 13px 'Inter', 'Segoe UI', sans-serif; fill: #ffffffa6; }
      .big { font: 700 20px 'Inter', 'Segoe UI', sans-serif; fill: #fff; }
      /* the focus ring glides tile to tile, like pressing right on the d-pad */
      .ring { animation: glide 6s cubic-bezier(.2,.9,.3,1) infinite; }
      @keyframes glide {
        0%, 18%   { transform: translateX(0); }
        25%, 43%  { transform: translateX(232px); }
        50%, 68%  { transform: translateX(464px); }
        75%, 93%  { transform: translateX(696px); }
        100%      { transform: translateX(0); }
      }
      .lift1 { animation: lift1 6s ease infinite; transform-box: fill-box; transform-origin: center; }
      .lift2 { animation: lift2 6s ease infinite; transform-box: fill-box; transform-origin: center; }
      .lift3 { animation: lift3 6s ease infinite; transform-box: fill-box; transform-origin: center; }
      .lift4 { animation: lift4 6s ease infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes lift1 { 0%,18% { transform: scale(1.05); } 25%,93% { transform: scale(1); } 100% { transform: scale(1.05); } }
      @keyframes lift2 { 0%,18% { transform: scale(1); } 25%,43% { transform: scale(1.05); } 50%,100% { transform: scale(1); } }
      @keyframes lift3 { 0%,43% { transform: scale(1); } 50%,68% { transform: scale(1.05); } 75%,100% { transform: scale(1); } }
      @keyframes lift4 { 0%,68% { transform: scale(1); } 75%,93% { transform: scale(1.05); } 100% { transform: scale(1); } }
      .lens { animation: lens 8s cubic-bezier(.2,.9,.3,1) infinite; }
      @keyframes lens { 0%,45% { transform: translateX(0); } 50%,95% { transform: translateX(84px); } 100% { transform: translateX(0); } }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity="0.7">
    <circle cx="300" cy="140" r="160" fill="#ff7a59"/><circle cx="1020" cy="420" r="200" fill="#4facfe"/><circle cx="760" cy="120" r="120" fill="#8e2de2"/>
  </g>

  <!-- top bar -->
  <rect x="150" y="48" width="70" height="34" rx="17" fill="#111318" fill-opacity="0.58" stroke="#fff" stroke-opacity="0.14"/>
  <text x="185" y="70" text-anchor="middle" class="label">10:24</text>
  <rect x="388" y="40" width="504" height="52" rx="26" fill="#111318" fill-opacity="0.58" stroke="#fff" stroke-opacity="0.14"/>
  <rect class="lens" x="394" y="45" width="80" height="42" rx="21" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.2"/>
  <g class="small" text-anchor="middle">
    <text x="434" y="71">Home</text><text x="518" y="71">Settings</text><text x="602" y="71">Audio</text>
    <text x="686" y="71">Social</text><text x="770" y="71">Apps</text><text x="852" y="71">Widgets</text>
  </g>
  <rect x="1020" y="48" width="110" height="34" rx="17" fill="#111318" fill-opacity="0.58" stroke="#fff" stroke-opacity="0.14"/>
  <text x="1075" y="70" text-anchor="middle" class="label">Controller</text>

  <!-- panel -->
  <rect x="150" y="110" width="980" height="330" rx="34" fill="#111318" fill-opacity="0.55" stroke="#fff" stroke-opacity="0.14"/>
  <rect class="lift1" x="190" y="140" width="200" height="200" rx="26" fill="url(#t1)"/>
  <rect class="lift2" x="422" y="140" width="200" height="200" rx="26" fill="url(#t2)"/>
  <rect class="lift3" x="654" y="140" width="200" height="200" rx="26" fill="url(#t3)"/>
  <rect class="lift4" x="886" y="140" width="200" height="200" rx="26" fill="url(#t4)"/>
  <!-- focus ring: white, hugging the tile's edge -->
  <rect class="ring" x="185" y="135" width="210" height="210" rx="30" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="192" y="386" class="big">Continue playing</text>
  <text x="192" y="410" class="small">Steam · played 2 h ago</text>
  <rect x="842" y="378" width="96" height="38" rx="19" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.16"/>
  <text x="890" y="402" text-anchor="middle" class="label">Home</text>
  <rect x="950" y="378" width="104" height="38" rx="19" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.16"/>
  <text x="1002" y="402" text-anchor="middle" class="label">Library</text>

  <!-- hint bar -->
  <rect x="476" y="462" width="328" height="34" rx="17" fill="#111318" fill-opacity="0.58" stroke="#fff" stroke-opacity="0.14"/>
  <g class="small"><text x="500" y="484">LB RB  Tabs</text><circle cx="616" cy="479" r="8" fill="#6fd36f"/><text x="630" y="484">Play</text><circle cx="694" cy="479" r="8" fill="#ff6b6b"/><text x="708" y="484">Back</text></g>
</svg>
